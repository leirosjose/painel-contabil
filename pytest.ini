[pytest]
addopts = --strict-markers
testpaths = tests
markers =
    db: exige um PostgreSQL vivo (banco scratch por teste, fixture banco_scratch).
    apptest: executa o app via st.testing.v1.AppTest contra o banco com a carga sintetica (leva db junto).
    chrome: sobe Chrome/Chromium real via kaleido/playwright; fora do job padrao.
