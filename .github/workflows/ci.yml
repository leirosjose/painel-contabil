name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff==0.14.5
      - run: ruff check .

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - run: python -m pytest -m "not db and not chrome" -q

  test-db:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_USER: postgres
      PG_PASS: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - run: python -m pytest -m "db and not chrome" -q

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t painel-contabil:ci .
      - name: carga sintetica de ponta a ponta no compose
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do curl -fsS localhost:8503/_stcore/health && break; sleep 2; done
          test "$(docker compose ps -a carga --format '{{.ExitCode}}')" = "0"
          docker compose logs carga | grep -q "sem alertas"
          curl -fsS localhost:8503/_stcore/health
      - if: always()
        run: docker compose down -v

  imagem:
    # Imagem pronta no GHCR (amd64 + arm64): so no push da main deste repositorio,
    # depois de todos os outros jobs verdes. PR e fork nunca publicam.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'leirosjose/painel-contabil'
    needs: [lint, test, test-db, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/leirosjose/painel-contabil:latest
          labels: org.opencontainers.image.source=https://github.com/leirosjose/painel-contabil
          cache-from: type=gha
          cache-to: type=gha,mode=max
