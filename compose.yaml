# docker compose up  ->  sobe o Postgres, carrega os dados sinteticos pelo
# pipeline completo e serve o painel em http://localhost:8503.
# A imagem pronta vem do GHCR; sem acesso a ela, o compose builda localmente
# (ou force com: docker compose up --build).
x-ambiente: &ambiente
  PG_HOST: db
  PG_PORT: "5432"
  PG_DB: painel_bi
  PG_USER: postgres
  PG_PASS: postgres

x-imagem: &imagem
  image: ghcr.io/leirosjose/painel-contabil:latest
  build: .
  pull_policy: missing

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: painel_bi
    volumes:
      - banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d painel_bi"]
      interval: 2s
      timeout: 3s
      retries: 30

  carga:
    <<: *imagem
    environment: *ambiente
    working_dir: /app/etl
    command: ["python", "main.py", "--empresa", "all", "--inicio", "2023-12", "--fim", "2025-12"]
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *imagem
    environment: *ambiente
    ports:
      - "127.0.0.1:8503:8503"
    volumes:
      - ./saida:/app/saida
    depends_on:
      carga:
        condition: service_completed_successfully

volumes:
  banco:
